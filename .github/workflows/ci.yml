name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Placeholders only. The build evaluates modules and prerenders pages, so
      # it needs these present — but nothing here contacts Supabase or Stripe,
      # and no real credentials belong in CI.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_PLUS_MONTHLY_PRICE_ID: price_plus_monthly
          STRIPE_PLUS_ANNUAL_PRICE_ID: price_plus_annual
          STRIPE_PRO_MONTHLY_PRICE_ID: price_pro_monthly
          STRIPE_PRO_ANNUAL_PRICE_ID: price_pro_annual
